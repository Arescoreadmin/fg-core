name: prod-auth-smoke

# MODE-B-PROOF-HARDENING-001
#
# Mode A (public smoke): runs automatically after fg-required passes on main.
# Mode B (authenticated): manually triggered ONLY — never automatic.
#
# Mode B requires explicit operator approval and dedicated synthetic identity.
# Mode B is NEVER triggered by push, PR, or scheduled events.
#
# Evidence verification is a distinct acceptance step — never bypassed with
# continue-on-error without a subsequent hard-fail gate.

on:
  # Automatic trigger: runs Mode A after frostgate-core-ci passes on main.
  workflow_run:
    workflows: ["frostgate-core-ci"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verification mode: smoke (Mode A, safe) or authenticated (Mode B, operator-approved)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - authenticated
      actor_profile:
        description: 'Mode B actor profile (internal_operator or client_executive)'
        required: false
        default: 'internal_operator'
        type: choice
        options:
          - internal_operator
          - client_executive
      console_url:
        description: 'Console URL (default: https://console.frostgate.ai)'
        required: false
        default: 'https://console.frostgate.ai'
      write_evidence:
        description: 'Write evidence artifact'
        required: false
        default: 'true'
        type: boolean
  workflow_call:
    inputs:
      mode:
        required: false
        default: 'smoke'
        type: string
      actor_profile:
        required: false
        default: 'internal_operator'
        type: string
      console_url:
        required: false
        default: 'https://console.frostgate.ai'
        type: string

concurrency:
  group: prod-auth-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # ─────────────────────────────────────────────
  # Mode A — Public Production Smoke (no credentials)
  # ─────────────────────────────────────────────
  smoke:
    name: prod-smoke (Mode A)
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name != 'workflow_run' && (inputs.mode == 'smoke' || inputs.mode == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      PYTHONUNBUFFERED: "1"
      FG_PROD_SMOKE_URL: ${{ inputs.console_url || 'https://console.frostgate.ai' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_CONSOLE_PROJECT_ID || '' }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install requests

      - name: Run Mode A — public production smoke
        id: smoke_run
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python tools/testing/production/prod_smoke_001.py \
            ${{ (github.event_name == 'workflow_run' || inputs.write_evidence) && '--write-evidence' || '' }}

      - name: Upload evidence artifact
        if: always() && (github.event_name == 'workflow_run' || inputs.write_evidence == true)
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-evidence-${{ github.run_attempt }}
          path: contracts/artifacts/identity/prod-auth-automation-001-smoke-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## PROD-AUTH-AUTOMATION-001 — Mode A: Public Production Smoke"
            echo ""
            echo "- Status: **${{ job.status }}**"
            echo "- Triggered by: \`${{ github.event_name }}\`"
            echo "- Verified SHA: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- URL: ${{ env.FG_PROD_SMOKE_URL }}"
            echo "- Run: \`${{ github.run_id }}\`"
            echo ""
            echo "> Mode B (authenticated) requires manual dispatch with \`mode: authenticated\`."
            echo "> See \`docs/deployment/runbook-prod-auth-automation-001.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # Mode B — Authenticated Playwright Verification
  # NEVER triggered automatically.
  # ─────────────────────────────────────────────
  authenticated:
    name: prod-auth (Mode B — ${{ inputs.actor_profile || 'internal_operator' }})
    # NEVER triggered automatically. workflow_run is explicitly excluded.
    if: ${{ github.event_name != 'workflow_run' && inputs.mode == 'authenticated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Hard max retries: 1 (no silent retry on auth failure)

    env:
      PYTHONUNBUFFERED: "1"
      FG_PROD_SMOKE_URL: ${{ inputs.console_url || 'https://console.frostgate.ai' }}
      FG_PROD_AUTH_TEST_ENABLED: "true"
      FG_PROD_ACTOR_PROFILE: ${{ inputs.actor_profile || 'internal_operator' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install requests playwright

      - name: Install Playwright browser
        run: playwright install chromium --with-deps
        timeout-minutes: 5

      - name: Verify activation guard
        # Secrets never appear in command lines or logs.
        # This step fails with exit 1 if secrets are absent — job fails before any auth.
        run: |
          set -euo pipefail
          if [ -z "${FG_PROD_TEST_EMAIL:-}" ] || [ -z "${FG_PROD_TEST_PASSWORD:-}" ]; then
            echo "ERROR: FG_PROD_TEST_EMAIL and FG_PROD_TEST_PASSWORD must be set in repository secrets."
            echo "Mode B is operator-approved only. See runbook-prod-auth-automation-001.md"
            exit 2
          fi
          echo "Activation guard passed. Actor profile: ${FG_PROD_ACTOR_PROFILE}"
        env:
          FG_PROD_TEST_EMAIL: ${{ secrets.FG_PROD_TEST_EMAIL }}
          FG_PROD_TEST_PASSWORD: ${{ secrets.FG_PROD_TEST_PASSWORD }}

      - name: Run Mode B — authenticated Playwright verification
        id: auth_run
        # Failure produces nonzero exit; evidence is still uploaded in the next step.
        # Exit codes: 0=ACCEPTED, 1=REJECTED_FAIL, 2=BLOCKED, 3=REJECTED_INCOMPLETE, 4=error
        env:
          FG_PROD_TEST_EMAIL: ${{ secrets.FG_PROD_TEST_EMAIL }}
          FG_PROD_TEST_PASSWORD: ${{ secrets.FG_PROD_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          python tools/testing/production/auth_harness_001.py \
            --write-evidence \
            --headless true \
            --actor-profile "${FG_PROD_ACTOR_PROFILE}"
        timeout-minutes: 10

      - name: Upload evidence artifact (always — even on harness failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-auth-evidence-${{ env.FG_PROD_ACTOR_PROFILE }}-${{ github.run_attempt }}
          path: |
            contracts/artifacts/identity/prod-auth-automation-001-auth-evidence.json
            contracts/artifacts/identity/prod-auth-client-executive-evidence.json
          if-no-files-found: warn
          retention-days: 90

      - name: Verify evidence — independent acceptance gate
        # Runs even when auth_run failed — recomputes fingerprint and acceptance.
        # Exits nonzero if evidence is missing, tampered, or not ACCEPTED.
        # This is the authoritative acceptance step; auth_run exit code alone is not sufficient.
        if: always()
        id: verify
        run: |
          set -euo pipefail
          PROFILE="${FG_PROD_ACTOR_PROFILE}"
          if [ "${PROFILE}" = "client_executive" ]; then
            EVIDENCE_FILE="contracts/artifacts/identity/prod-auth-client-executive-evidence.json"
          else
            EVIDENCE_FILE="contracts/artifacts/identity/prod-auth-automation-001-auth-evidence.json"
          fi
          if [ ! -f "${EVIDENCE_FILE}" ]; then
            echo "ERROR: Evidence file not found: ${EVIDENCE_FILE}"
            echo "Workflow cancellation or timeout before evidence was written."
            exit 3
          fi
          python tools/testing/production/verify_evidence.py "${EVIDENCE_FILE}"
        timeout-minutes: 2

      - name: Publish job summary
        if: always()
        run: |
          PROFILE="${FG_PROD_ACTOR_PROFILE}"
          HARNESS_EXIT="${{ steps.auth_run.outcome }}"
          VERIFY_EXIT="${{ steps.verify.outcome }}"
          {
            echo "## MODE-B-PROOF-HARDENING-001 — Mode B: Authenticated Playwright"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Actor profile | \`${PROFILE}\` |"
            echo "| Harness result | **${HARNESS_EXIT}** |"
            echo "| Evidence verification | **${VERIFY_EXIT}** |"
            echo "| URL | ${{ env.FG_PROD_SMOKE_URL }} |"
            echo "| Run | \`${{ github.run_id }}\` |"
            echo "| Repo SHA | \`${{ github.sha }}\` |"
            echo "| Identity | synthetic (see evidence artifact) |"
            echo ""
            echo "> **This run was operator-approved. Never runs automatically.**"
            echo "> Evidence fingerprint and acceptance decision are in the uploaded artifact."
            echo "> Independent verification: \`python tools/testing/production/verify_evidence.py <file>\`"
            echo ""
            if [ "${VERIFY_EXIT}" = "success" ]; then
              echo "### Acceptance: ACCEPTED ✓"
            else
              echo "### Acceptance: NOT ACCEPTED ✗"
              echo "> Production launch gate is NOT cleared by this run."
              echo "> See the evidence artifact and runbook for next steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
