name: "fg-secrets"
description: "Generate CI secrets and export them to GITHUB_ENV"

runs:
  using: "composite"
  steps:
    - name: Generate CI secrets
      shell: bash
      run: |
        set -euo pipefail

        gen() {
          # Prefer Python if available
          if command -v python >/dev/null 2>&1; then
            python - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
                    return 0
                  fi

          # Fallback to OpenSSL
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 48 | tr -d '\n' | tr '/+=' '___'
            echo
            return 0
          fi

          echo "❌ No python or openssl available to generate secrets" >&2
          exit 1
        }

        # P0-REPO-SECURITY-ENFORCEMENT-001: register every generated value as a
        # log mask BEFORE exporting it, so it never appears in step env dumps
        # (this repository's Actions logs are public).
        export_masked() {
          local name="$1" value="$2"
          echo "::add-mask::${value}"
          echo "${name}=${value}" >> "$GITHUB_ENV"
        }
        export_masked FG_API_KEY "$(gen)"
        export_masked REDIS_PASSWORD "$(gen | cut -c1-32)"
        export_masked POSTGRES_PASSWORD "$(gen | cut -c1-32)"
        export_masked FG_AGENT_API_KEY "$(gen)"
        export_masked FG_WEBHOOK_SECRET "$(gen)"
        export_masked FG_KEY_PEPPER "$(gen)"
