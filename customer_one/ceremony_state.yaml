# ---------------------------------------------------------------------------
# WHY TRUST IS NOT PROVEN
# Two defects prevent Customer-Zero acceptance. BOTH must be repaired offline
# before a third paid ceremony is authorized.
# ---------------------------------------------------------------------------

blocking_defects:
  - id: "DEFECT-PROVENANCE-INTEGRITY"
    short: "Report/provenance integrity"
    detail: >
      Verification trusts the stored manifest_hash without sufficiently
      re-deriving or binding it to current report_json. A DB-level mutation of
      report_json without changing manifest material produces an invalid
      verification outcome that the current verifier accepts. DB-level tampering
      of report_json must fail verification deterministically.
    severity: "P0"
    repair_work_item: "PROVENANCE-INTEGRITY-001"

  - id: "DEFECT-VERIFIER-CONTRACT"
    short: "Verifier contract — non-deterministic error on cross-domain/rotation path"
    detail: >
      A post-rotation cross-domain verification attempt involving differing key
      versions can raise VaultTransitError instead of returning a deterministic
      fail-closed boolean result. Every wrong-domain / wrong-key / wrong-version /
      malformed-proof / replay / unavailable-Vault path must have an explicitly
      tested deterministic fail-closed outcome. Non-deterministic exception
      propagation is not a valid fail-closed contract.
    severity: "P0"
    repair_work_item: "VAULT-VERIFY-CONTRACT-001"

