# ---------------------------------------------------------------------------
# THIRD CEREMONY PREREQUISITES
#
# ALL THREE must complete before a third paid ceremony is authorized.
# These are OFFLINE (zero-cost) work items.
# ---------------------------------------------------------------------------

third_ceremony_prerequisites:
  - id: "PROVENANCE-INTEGRITY-001"
    title: "Repair report/provenance verification integrity"
    description: >
      Repair the report/provenance verification contract. Current report content
      (report_json) must be cryptographically or deterministically bound such
      that DB-level mutation of report_json without also mutating the manifest
      material produces a detectable verification failure. Proof requires an
      adversarial test demonstrating that a report with mutated report_json
      fails verification.
    work_class: "REPAIR"
    requires_paid_infrastructure: false
    blocks: "CUSTOMER-ZERO-FINAL-READINESS-001"
    order: 1

  - id: "VAULT-VERIFY-CONTRACT-001"
    title: "Repair deterministic fail-closed verification semantics"
    description: >
      Every verify_* path must return a deterministic boolean. Wrong domain,
      wrong key, wrong version, malformed proof, replay, unavailable Vault, and
      cross-domain paths must all have explicitly tested fail-closed outcomes
      (return False). No path may raise VaultTransitError as a substitute for
      a boolean fail-closed result. Proof requires a focused test suite covering
      all enumerated cases including the post-rotation cross-domain case.
    work_class: "REPAIR"
    requires_paid_infrastructure: false
    blocks: "CUSTOMER-ZERO-FINAL-READINESS-001"
    order: 2

  - id: "CUSTOMER-ZERO-FINAL-READINESS-001"
    title: "Customer-Zero comprehensive offline readiness gate"
    description: >
      Comprehensive zero-cost readiness gate. Must prove every prerequisite for
      acceptance without creating paid HCP infrastructure. Includes: provenance
      integrity repaired and tested, verifier contract repaired and tested,
      offline ceremony simulation green, all existing trust ceremony tests pass,
      cost doctrine documented, Run 3 operational plan finalized, explicit cost
      envelope prepared (fresh authorization required — $321.81 historical usage
      means prior cost envelope is consumed).
    work_class: "NEXT"
    requires_paid_infrastructure: false
    blocks: "CUSTOMER-ZERO-TRUST-003"
    order: 3

