next_sequence:
  - id: "TRUST-BINDING-001"
    title: "TRUST-BINDING-001 — Bind governance artifacts to canonical non-exportable trust authority"
    role: "INTERNAL_PREREQUISITE"
    parent_objective: "CUSTOMER-ZERO-ACCEPT-001"
    blocker_closed: >
      CLIENT-READINESS-002 identified and current-main inspection at
      302173ed (2026-09-30) confirmed: governance artifacts on the Customer-One
      proof chain are not cryptographically bound to the canonical non-exportable
      Vault Transit trust authority. (A) services/governance/report/signing.py:30
      signs reports via FG_REPORT_SIGNING_KEY (env-var Ed25519 seed); the Vault
      Transit adapter at services/cgin/key_management/vault_transit.py is not
      referenced from signing.py, qualification_authority.py, or
      governed_delivery_service.py. (B) FaQualificationDecision and
      FaGovernedDeliveryAuthorization (api/db_models_field_assessment.py:978,1113)
      have no signature, signing_key_id, or key_version columns; qualify_report_attest_route
      records attested=body.attested as an unsigned boolean. (C) Therefore, even
      after CUSTOMER-ZERO-TRUST-001 provisions the operational trust authority, all
      three artifact types will continue to use the env-var key or carry no
      cryptographic provenance. Trust infrastructure existing is not the same as
      governance artifacts being cryptographically bound to it.
    freeze_law_justification: >
      CLIENT-READINESS-002 (PR #727) recorded this as P1-2. Current-main
      inspection of signing.py, db_models_field_assessment.py, and
      api/field_assessment.py at HEAD 302173ed reconfirms the gap. The
      Customer-One first-client claim — "the exact governance artifact relied upon
      was issued by the exact authorized trust authority and can be independently
      verified" — cannot be satisfied under the current code. This is not platform
      expansion, generalized PKI, a Trust Console, autonomous governance, or AGI
      governance. It is the smallest bounded work that closes the composition gap
      between the existing Vault Transit trust infrastructure and the existing
      governance artifact issuance paths on the Customer-One proof chain. Code
      implementation can proceed at $0 against the existing local/test Vault
      boundary (PR #720); live production proof requires CUSTOMER-ZERO-TRUST-001
      operational ceremony.
    status: NEXT
    work_class: "REPAIR"
    completion_evidence:
      - "report signing path invokes Vault Transit sign() for the identity trust role; FG_REPORT_SIGNING_KEY env-var path retired for production signing"
      - "FaQualificationDecision persists signing_key_id, key_version, and vault_signature for each finalized decision"
      - "FaGovernedDeliveryAuthorization persists signing_key_id, key_version, and vault_signature for each authorization"
      - "TrustAnchor.verify() confirms round-trip signature validity for at least one qualification and one delivery authorization"
      - "qualify_report_finalize_route produces a Vault-signed qualification decision row"
      - "governed_delivery_route produces a Vault-signed authorization row"
      - "migration adds signature columns to fa_qualification_decisions and fa_governed_delivery_authorizations"
      - "adversarial tests prove that records without valid vault signatures are rejected at qualification and delivery boundaries"
    forbidden_scope:
      - "CUSTOMER-ZERO-TRUST-001 operational ceremony or HCP provisioning"
      - "CUSTOMER-ZERO-ACCEPT-001 execution or acceptance run"
      - "new Vault trust roles beyond the three already defined in CUSTOMER-ZERO-TRUST-001"
      - "generalized PKI, IAM, RBAC, or secrets-platform redesign"
      - "Trust Console, audit dashboard, or governance product UI changes"
      - "autonomous governance, AGI governance, or unrelated platform expansion"
      - "migration content beyond signature columns for qualification and delivery authorization tables"
  - id: "CUSTOMER-ZERO-TRUST-001"
    title: "CUSTOMER-ZERO-TRUST-001 — Bounded operational trust infrastructure"
    role: "INTERNAL_PREREQUISITE"
    parent_objective: "CUSTOMER-ZERO-ACCEPT-001"
    blocker_closed: >
      Customer-Zero approval cannot be defensibly issued until identity,
      acceptance entitlement, and approval evidence each have separate,
      non-exportable operational signing authorities with public verification.
    freeze_law_justification: >
      This is the smallest proven blocker preventing completion of the already
      authorized Customer-Zero acceptance operation. Existing providers are
      test-only or stubs; no production-capable issuer or managed signer exists.
    status: NEXT
    work_class: "REPAIR"
    completion_evidence:
      - "three distinct managed trust roles and stable key IDs"
      - "canonical identity assertion and bounded acceptance entitlement issuance"
      - "non-exportable approval signing and public-only verification"
      - "historical verification, durable provenance, and operational fail-closed tests"
    forbidden_scope:
      - "PROD-QUAL-001"
      - "GOV-DELIVERY-001"
      - "generalized PKI, IAM, RBAC, or secrets-platform redesign"
      - "Customer-Zero corpus or expected-outcome changes"
  - id: "L14"
    title: "Customer-One Commercial Execution"
    files: []
    blocker_closed: >
      No paying client; L14 cannot close until FG_RESULT_TRUTH_GATE result truth and all
      mandatory production gates (dependency security, schema/RLS, canonical
      assessment proof, durable execution, and recovery/retention) are proven.
    status: NEXT
    note: "Non-engineering. Tasks: design partner scheduled, price locked ($5k), packet complete, Stripe proven, founder review; closure remains gated by FG_RESULT_TRUTH_GATE acceptance gates."

