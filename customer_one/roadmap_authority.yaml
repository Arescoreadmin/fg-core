freeze_law: >
  New capability enters the critical path only if it: (1) closes a Customer-One
  blocker with evidence, (2) is required by a contracted customer requirement, or
  (3) measurably reduces delivery risk or cost with evidence. Preference, curiosity,
  and speculative scale are not sufficient justification.

work_classes:
  NEXT:
    description: "Authorized work — on the critical path to Customer-One"
    gate: OPEN
  REPAIR:
    description: "Defect repair — always authorized; no Customer-One justification required"
    gate: OPEN
  DEFERRED:
    description: "Explicitly deferred until after Customer-One or a named gate"
    gate: BLOCKED
  UNKNOWN:
    description: "Work of unknown classification — fail-closed, treated as blocked"
    gate: BLOCKED

