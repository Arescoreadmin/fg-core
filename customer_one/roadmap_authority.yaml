phase: "Identity Platform Completion → First Paying Client"
goal: "Customer-One: first paying client engagement — invoice issued, paid, portal accessed"

freeze_law: >
  New capability enters the critical path only if it: (1) closes a Customer-One
  blocker with evidence, (2) is required by a contracted customer requirement, or
  (3) measurably reduces delivery risk or cost with evidence. Preference, curiosity,
  and speculative scale are not sufficient justification.

work_classes:
  NEXT:
    description: "Authorized work — on the critical path to Customer-One"
    gate: OPEN
  REPAIR:
    description: "Defect repair — always authorized; no Customer-One justification required"
    gate: OPEN
  DEFERRED:
    description: "Explicitly deferred until after Customer-One or a named gate"
    gate: BLOCKED
  UNKNOWN:
    description: "Work of unknown classification — fail-closed, treated as blocked"
    gate: BLOCKED

next_sequence:
  - id: "FGA-028"
    title: "Grounded Determination & Executive Reporting Authority"
    files:
      - "api/field_assessment.py"
      - "services/governance/report/engine.py"
      - "tests/test_result_semantic_authority.py"
    blocker_closed: >
      The forensic Customer-One audit requires an expert-approved golden and
      metamorphic result-truth gate before FrostGate may issue a defensible
      Verified AI Governance Baseline. Existing deterministic semantics and
      FGA-025–027 fixes are not yet assembled into a release-blocking authority
      that proves grounded findings, claim lineage, and executive-report safety.
    status: NEXT
    required_gates:
      - "FG_RESULT_TRUTH_GATE"
      - "PRODUCTION_DEPENDENCY_SECURITY"
      - "PRODUCTION_SCHEMA_AND_RLS"
      - "CANONICAL_ASSESSMENT_PROOF"
      - "DURABLE_EXECUTION_AND_RECOVERY"
    gate_policy: >
      These named production gates are mandatory acceptance gates within FGA-028
      and must pass before Customer-One data access, report issuance, or L14
      closure. They are not independently authorized feature work.

  - id: "L14"
    title: "Customer-One Commercial Execution"
    files: []
    blocker_closed: >
      No paying client; L14 cannot close until FGA-028 result truth and all
      mandatory production gates (dependency security, schema/RLS, canonical
      assessment proof, durable execution, and recovery/retention) are proven.
    status: NEXT
    note: "Non-engineering. Tasks: design partner scheduled, price locked ($5k), packet complete, Stripe proven, founder review; closure remains gated by FGA-028 acceptance gates."

