completed:
  - id: "VAULT-VERIFY-CONTRACT-001"
    title: "VAULT-VERIFY-CONTRACT-001 — Repair deterministic fail-closed verification semantics"
    prs: ["#751"]
    merged_sha: "8d3dd55aedcce3ad719ca9fd829371f5f6063ab2"
    note: >
      Repairs DEFECT-VERIFIER-CONTRACT (P0). Final merged contract:
      VaultKeyVersionUnavailableError(VaultTransitError) added to vault_transit.py;
      VaultTransitClient.public_key() raises it when the requested key version is absent
      (wrong-version proof = invalid, not a Vault outage).
      VaultBackend.verify() catches VaultKeyVersionUnavailableError → return False;
      catches remaining VaultTransitError → raises VaultVerifierUnavailableError
      (genuine Vault outage — distinguishable internally for audit/logging).
      TrustBindingAuthority.verify_*() catches VaultTransitError → return False
      (deterministic boolean fail-closed contract satisfied at authority boundary).
      All verify_* paths return a deterministic boolean; no path raises VaultTransitError
      as substitute for a fail-closed boolean result.
      51 adversarial tests (A–N) pass including root-cause regression and two new
      VaultBackend-layer contract tests (test_j8, test_j9).
      No migrations, no schema changes, no paid infrastructure.
      CUSTOMER_ZERO_TRUST_NOT_PROVEN unchanged.
  - id: "PROVENANCE-INTEGRITY-001"
    title: "PROVENANCE-INTEGRITY-001 — Repair report/provenance verification integrity"
    prs: ["#750"]
    merged_sha: "7a707cfb4dd2d70bf44395afc3eace9bc62bead6"
    note: >
      Repairs DEFECT-PROVENANCE-INTEGRITY (P0). Added _derive_manifest_hash_from_report_json()
      helper in api/field_assessment.py; added content-binding pre-check at all three
      Vault trust-binding verification sites (verify_engagement_report_route,
      qa_approve_report_route, export_engagement_report_route). DB-level mutation of
      report_json without changing manifest_hash now fails verification deterministically,
      regardless of FG_PROVENANCE_MODE (mismatch raises HTTPException directly, bypassing
      mode-dependent enforcement). 45 adversarial tests (A–K) pass including
      mode-independence tests. No migrations, no schema changes, no paid infrastructure.
      CUSTOMER_ZERO_TRUST_NOT_PROVEN unchanged.
  - id: "CZ-RECONCILE-001"
    title: "CZ-RECONCILE-001 — Reconcile Customer-Zero trust ceremony state"
    prs: ["#749"]
    note: >
      Reconciles repository state with the factual outcome of two Customer-Zero
      trust ceremony runs. Records CUSTOMER_ZERO_TRUST_NOT_PROVEN status, the two P0
      defects (DEFECT-PROVENANCE-INTEGRITY and DEFECT-VERIFIER-CONTRACT), and
      CUSTOMER_ZERO_COST_CONTAINMENT_COMPLETE. Introduces ceremony_state.yaml as the
      canonical machine-readable ceremony status record. Moves CUSTOMER-ZERO-TRUST-001
      to blocked (ATTEMPTED_NOT_PROVEN). Registers PROVENANCE-INTEGRITY-001,
      VAULT-VERIFY-CONTRACT-001, and CUSTOMER-ZERO-FINAL-READINESS-001 as the required
      offline prerequisite sequence before CUSTOMER-ZERO-TRUST-003 may be authorized.
      52 offline determinism tests enforce the ceremony state and sequence invariants.
  - id: "TRUST-BINDING-001"
    title: "TRUST-BINDING-001 — Bind governance artifacts to canonical non-exportable trust authority"
    prs: ["#731"]
    merged_sha: "2562e8752d7478f1b47c3456d2c9637dfdf0c040"
    note: >
      All three governance artifact types are now cryptographically bound to
      the canonical Vault Transit trust authority via TrustBindingAuthority
      (services/governance/trust_binding.py). Report issuance uses the
      IDENTITY trust role; qualification decisions use the APPROVAL trust
      role; governed-delivery authorizations use the ACCEPTANCE trust role.
      Domain separators prevent cross-artifact signature replay. Migrations
      0193 and 0194 add trust columns to fa_qualification_decisions,
      fa_governed_delivery_authorizations, and governance_reports.
      governed_delivery_execute_route verifies delivery-authorization trust
      before transport; governed_delivery_route verifies qualification trust
      before issuing authorization. 42 adversarial tests confirm role
      separation, round-trip verification, and fail-closed behavior. Production
      execution requires CUSTOMER-ZERO-TRUST-001 operational ceremony.
  - id: "FA-ACTOR-001"
    title: "Canonical Field Assessment Human Actor Authority"
    prs: ["#710", "#711"]
    merged_sha: "49fe1fcf32a2d28cb74f40523dc2f1cd0c5f4522"
    note: >
      Material Field Assessment mutations now require canonical authenticated
      human authority, current active membership and capability, tenant and
      engagement binding, and canonical actor persistence/audit attribution.
      #711 additionally preserves delegated capabilities, requires an active
      canonical principal, and binds the signed target tenant ahead of the
