  - id: "VAULT-VERIFY-CONTRACT-001"
    title: "VAULT-VERIFY-CONTRACT-001 — Repair deterministic fail-closed verification semantics"
    prs: ["#751"]
    merged_sha: "8d3dd55aedcce3ad719ca9fd829371f5f6063ab2"
    note: >
      Repairs DEFECT-VERIFIER-CONTRACT (P0). Final merged contract:
      VaultKeyVersionUnavailableError(VaultTransitError) added to vault_transit.py;
      VaultTransitClient.public_key() raises it when the requested key version is absent
      (wrong-version proof = invalid, not a Vault outage).
      VaultBackend.verify() catches VaultKeyVersionUnavailableError → return False;
      catches remaining VaultTransitError → raises VaultVerifierUnavailableError
      (genuine Vault outage — distinguishable internally for audit/logging).
      TrustBindingAuthority.verify_*() catches VaultTransitError → return False
      (deterministic boolean fail-closed contract satisfied at authority boundary).
      All verify_* paths return a deterministic boolean; no path raises VaultTransitError
      as substitute for a fail-closed boolean result.
      51 adversarial tests (A–N) pass including root-cause regression and two new
      VaultBackend-layer contract tests (test_j8, test_j9).
      No migrations, no schema changes, no paid infrastructure.
      CUSTOMER_ZERO_TRUST_NOT_PROVEN unchanged.
