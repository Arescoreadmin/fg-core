  - id: "GOV-DELIVERY-TRANSPORT-001"
    title: "Governed Delivery Transport Authority"
    prs: ["#728", "#729"]
    merged_sha: "302173ed1ae809ce786bc720bc12e72ebd896f09"
    note: >
      PR #728 (31c35d68) introduced the governed delivery execution authority:
      fa_governed_delivery_attempts append-only table (tenant RLS, unique-succeeded
      partial index, append-only triggers), new /execute route that re-verifies
      the full authorization binding, renders artifact bytes, SHA-256s the served
      bytes, writes a SUCCEEDED attempt row, and only then transitions the report
      version to 'delivered'. PR #729 (302173ed) repaired the HTTP boundary defect:
      the /execute route now returns Response(content=artifact_bytes) so the exact
      bytes hashed and recorded by the SUCCEEDED attempt are the bytes that cross
      the operator boundary; headers are built before db.commit() so a serialization
      failure rolls back the SUCCEEDED row rather than leaving the operator
      permanently locked out. Merged-state validation: 44 focused transport tests
      pass (T1-T18 transport + 26 base delivery); fg-fast 496/2; fg-security 1239/1;
      fg-contract clean; mypy clean; git diff --check clean.
      SCOPE BOUNDARY: this item proves operator-direct custody (operator_direct
      recipient type only). The portal-recipient delivery paths
      (portal_membership / portal_invitation / portal_grant) return 501 and
      are separate scope; customer-boundary receipt evidence (fa_governed_delivery_attempts
      row written by a customer-authenticated session) is an operational requirement
      for CUSTOMER-ZERO-ACCEPT-001, not a completion criterion here. The legacy
      export route (api/field_assessment.py:9700) is also outside this item's scope.
      Work on those gaps proceeds under REPAIR classification and does not require
      reopening this item.
